name: Deploy Pages

# Deploys index.html and paint.html to GitHub Pages via Actions (not a
# root/docs branch source) so the repo root doesn't have to double as the
# servable web root. Both pages are otherwise ordinary root-relative fetches
# and imports: paint.html loads js/browser_main.mjs, js/paint/painter.mjs and
# js/paint/loop.mjs, and fetches sibling paint/*.planes; browser_main.mjs in
# turn imports ../grammar/vocabulary.json and ../grammar/messages/amber.json.
# The build step below reassembles exactly that sibling shape under _site/ —
# js/test/ and the rest of grammar/ (the self-hosted .planes sources and its
# own tests) are not part of what either page reaches, so they aren't shipped.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "paint.html"
      - "js/**"
      - "paint/**"
      - "grammar/vocabulary.json"
      - "grammar/messages/amber.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the servable surface
        run: |
          set -euo pipefail
          mkdir -p _site/js/paint _site/paint _site/grammar/messages
          cp index.html paint.html _site/
          cp js/*.mjs _site/js/
          cp js/paint/*.mjs _site/js/paint/
          cp paint/*.planes _site/paint/
          cp grammar/vocabulary.json _site/grammar/vocabulary.json
          cp grammar/messages/amber.json _site/grammar/messages/amber.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
