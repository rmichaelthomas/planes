name: Deploy Pages

# Deploys the root HTML pages to GitHub Pages via Actions (not a root/docs
# branch source) so the repo root doesn't have to double as the servable web
# root. The pages are otherwise ordinary root-relative fetches and imports:
# they load js/browser_main.mjs and modules under js/paint/ and js/sound/, and
# fetch sibling paint/*.planes; browser_main.mjs in turn imports
# ../grammar/vocabulary.json, ../grammar/core.json and
# ../grammar/messages/amber.json, and meta.html fetches the self-hosted
# ../grammar/*.planes sources to run them. scripts/assemble_site.sh reassembles
# exactly that sibling shape under _site/ — js/test/ is the only tree left
# behind, being no page's dependency.
#
# THE ASSEMBLY IS A SCRIPT so the gate can run it too. Inline, the only place it
# could be exercised was a runner, after merge: test_gate.py checked the surface
# against the REPO, where every file exists by construction, so a missing copy
# rule was invisible locally and fatal here.
#
# The copy is DERIVED from the tree, never an allowlist. An allowlist is how
# garden.html shipped in #52 and 404'd on Pages for two builds while this
# workflow reported success on every push: copying a list of files that all
# exist always succeeds, so a page missing from the list fails silently.
# test_gate.py::test_every_servable_page_reaches_the_deploy holds the line.

# No `paths:` filter. One used to live here, hand-maintained against the tree
# above — and it drifted, omitting grammar/*.planes and grammar/core.json,
# both of which the assembly copies because meta.html fetches them. A push
# touching only those paths built and passed every gate step and never
# deployed. The remedy is not a corrected list to watch for the next drift:
# it is that deploying on every push to main removes the category. This repo
# pushes a handful of times a day; the runner-minutes a filter would save are
# not worth a second silent-omission class (derived-surface-audit, instance 1).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the servable surface
        run: bash scripts/assemble_site.sh _site

      # `--source` is the load-bearing half: without it the check walks only
      # the pages that made it into _site, which is blind in exactly the way
      # the old allowlist was. It compares the served set against the authored
      # set first, then resolves every reference.
      - name: Every authored page ships, and its imports resolve inside _site
        run: python3 scripts/check_pages_surface.py _site --source=.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
